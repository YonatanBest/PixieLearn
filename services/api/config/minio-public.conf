server {
    listen 9100;

    add_header Access-Control-Allow-Origin "http://localhost:8443" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified" always;
    add_header Access-Control-Max-Age 3000 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_pass http://minio:9000;
    }
}
