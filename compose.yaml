services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixielearn
      POSTGRES_USER: pixielearn
      POSTGRES_PASSWORD: pixielearn
    ports:
      - "5432:5432"
    volumes:
      - pixielearn-postgres:/var/lib/postgresql/data
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: pixielearn
      MINIO_ROOT_PASSWORD: pixielearn-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pixielearn-minio:/bitnami/minio/data
  minio-public:
    image: nginx:alpine
    depends_on:
      - minio
    ports:
      - "9100:9100"
    volumes:
      - ./services/api/config/minio-public.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  pixielearn-postgres:
  pixielearn-minio:
